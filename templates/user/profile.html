{% extends 'base.html' %}


{% block main %}
  <main class="container my-5" style="max-width: 600px;">
    <div class="bg-white p-5 border">
      <h3 class="fw-bold mb-4">Shaxsiy Profil</h3>
      <form>
        <div class="mb-3">
          <label class="form-label small fw-bold">Ism Sharif</label>
          <input type="text" class="form-control" value="{{ request.user.first_name }} {{ request.user.last_name }}" name="profile_name">
        </div>
        <div class="mb-3">
          <label class="form-label small fw-bold">Elektron pochta</label>
          <input type="email" class="form-control" value="{{ request.user.email }}" name="profile_email">
        </div>
        <div class="mb-4">
          <label class="form-label small fw-bold">Telefon raqam</label>
          <input type="text" class="form-control" value="+998 90 123 45 67" name="profile_phone">
        </div>
        <button type="submit" class="custom-btn-primary">Ma'lumotlarni yangilash</button>
      </form>
    </div>
  </main>
{% endblock main %}
